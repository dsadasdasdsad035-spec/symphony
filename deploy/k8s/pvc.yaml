# 工作区 + 日志 + Agent 会话历史都落在 /data。
#
# 每个 Bug 一个工作区，浅克隆约 41MB，但 Agent 会执行 Maven 构建，
# 单个工作区会涨到 800MB 左右；并发 3 + 排队，30Gi 是留了很大余量的值。
# 用 longhorn-retain：删掉 PVC 不删数据，避免误操作把工作区连带处理进度一起抹掉。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: symphony-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      # 单个工作区跑完一轮 Java 构建后约 4GB，250Gi 可容纳约 60 个工作区。
      # 扩容史：30Gi → 100Gi（实测 3 个工作区占 11GB）→ 250Gi。
      # 上限受 Longhorn 单盘 589.5G 限制：卷是 2 副本，两份完整拷贝分别落在
      # 两台机器上，所以卷容量不可能超过最小副本盘的物理容量。
      # 当前副本位于 master3(489G 可用) 与 worker1(270G 可用)，
      # 250Gi 已接近 worker1 的安全边界；再往上必须先迁移副本或给节点加盘。
      # 只能往大了改（PVC 不支持缩容），改小会被 API 直接拒绝。
      storage: 250Gi
