<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 1790" width="1590" height="1790" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1590" height="1790" fill="#f8fafc"/>

  <text x="60" y="50" font-size="25" font-weight="700" fill="#0f172a">Symphony × 善治（SF 软件工厂）完整任务闭环</text>
  <text x="60" y="78" font-size="13.5" fill="#64748b">从「激活 Bug」到「合并关闭」的全链路，包含 MR 打回后的续改回路与各环节的状态语义</text>

  <rect x="60" y="136" width="310" height="1594" rx="16" fill="#fffbf5" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="400" y="136" width="320" height="1594" rx="16" fill="#f5f9ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="750" y="136" width="370" height="1594" rx="16" fill="#faf7ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="1150" y="136" width="380" height="1594" rx="16" fill="#f4fdfb" stroke="#99f6e4" stroke-width="1.5"/>

  <text x="78" y="170" font-size="14" font-weight="700" fill="#9a3412">善治平台 · Bug 状态</text>
  <text x="418" y="170" font-size="14" font-weight="700" fill="#1e40af">Symphony 编排层</text>
  <text x="768" y="170" font-size="14" font-weight="700" fill="#5b21b6">工作区 + Agent</text>
  <text x="1168" y="170" font-size="14" font-weight="700" fill="#0f766e">GitLab + 人工评审</text>
  <line x1="78" y1="184" x2="352" y2="184" stroke="#fed7aa" stroke-width="1"/>
  <line x1="418" y1="184" x2="702" y2="184" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="768" y1="184" x2="1102" y2="184" stroke="#ddd6fe" stroke-width="1"/>
  <line x1="1168" y1="184" x2="1512" y2="184" stroke="#99f6e4" stroke-width="1"/>

  <rect x="78" y="196" width="274" height="88" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="215" y="228" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">「激活」+ 已确认</text>
  <text x="215" y="252" font-size="11.5" fill="#7c2d12" text-anchor="middle">status = active</text>
  <text x="215" y="270" font-size="11.5" fill="#7c2d12" text-anchor="middle">confirmed = true</text>

  <rect x="418" y="196" width="284" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="560" y="228" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">① 轮询善治（每 15s）</text>
  <text x="560" y="252" font-size="11.5" fill="#1e40af" text-anchor="middle">find-page-list · 只查 active</text>
  <text x="560" y="270" font-size="11.5" fill="#1e40af" text-anchor="middle">按 productId / depId / 指派人</text>

  <rect x="418" y="318" width="284" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="560" y="350" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">② 归一化 + 过滤</text>
  <text x="560" y="374" font-size="11.5" fill="#1e40af" text-anchor="middle">转成统一 Issue 结构</text>
  <text x="560" y="394" font-size="11.5" fill="#1e40af" text-anchor="middle">confirmed = false → 记 :skip 不派发</text>

  <rect x="418" y="452" width="284" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="560" y="484" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">③ 派发判定</text>
  <text x="560" y="508" font-size="11.5" fill="#1e40af" text-anchor="middle">有空槽 · 未 claimed / running</text>
  <text x="560" y="528" font-size="11.5" fill="#1e40af" text-anchor="middle">未 blocked · label 满足</text>

  <rect x="768" y="586" width="334" height="112" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="935" y="616" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="middle">④ 准备工作区</text>
  <text x="935" y="640" font-size="11.5" fill="#5b21b6" text-anchor="middle">已存在 → 直接复用，跳过 after_create</text>
  <text x="935" y="660" font-size="11.5" fill="#5b21b6" text-anchor="middle">不存在 → clone --reference</text>
  <text x="935" y="680" font-size="11.5" fill="#5b21b6" text-anchor="middle">+ submodule update + pin 到记录提交</text>

  <rect x="768" y="732" width="334" height="74" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="935" y="762" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">⑤ before_run：fetch origin</text>
  <text x="935" y="786" font-size="11.5" fill="#5b21b6" text-anchor="middle">只取不合，是否合并交 Agent 判断</text>

  <rect x="768" y="840" width="334" height="92" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="935" y="870" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="middle">⑥ 启动 Agent（claude_cli）</text>
  <text x="935" y="894" font-size="11.5" fill="#5b21b6" text-anchor="middle">注入 MCP 工具：get_bug / bug_history</text>
  <text x="935" y="914" font-size="11.5" fill="#5b21b6" text-anchor="middle">confirm_bug / remark_bug / resolve_bug</text>

  <rect x="768" y="966" width="334" height="122" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="935" y="996" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="middle">⑦ Agent 改代码</text>
  <text x="935" y="1020" font-size="11.5" fill="#5b21b6" text-anchor="middle">核实缺陷 → 修子仓库 → 提交</text>
  <text x="935" y="1040" font-size="11.5" fill="#5b21b6" text-anchor="middle">推 symphony/&lt;ID&gt;</text>
  <text x="935" y="1062" font-size="11.5" fill="#5b21b6" text-anchor="middle">回根仓库推进子模块指针并推送</text>

  <rect x="1168" y="966" width="344" height="122" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.8"/>
  <text x="1340" y="996" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">⑧ 建 / 更新 MR</text>
  <text x="1340" y="1020" font-size="11.5" fill="#0f766e" text-anchor="middle">首次 → 用 GitLab API 新建 MR</text>
  <text x="1340" y="1040" font-size="11.5" fill="#0f766e" text-anchor="middle">续改 → 推同名分支</text>
  <text x="1340" y="1062" font-size="11.5" fill="#0f766e" text-anchor="middle">原 MR 自动更新，不新建</text>

  <rect x="768" y="1122" width="334" height="96" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="935" y="1154" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="middle">⑨ 回写善治</text>
  <text x="935" y="1178" font-size="11.5" fill="#5b21b6" text-anchor="middle">remark_bug：改动清单 + MR 链接</text>
  <text x="935" y="1198" font-size="11.5" fill="#5b21b6" text-anchor="middle">写进 Bug 操作历史</text>

  <rect x="78" y="1122" width="274" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="215" y="1154" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">⑩ 状态 →「已解决」</text>
  <text x="215" y="1178" font-size="11.5" fill="#92400e" text-anchor="middle">resolve_bug · resolution = fixed</text>
  <text x="215" y="1198" font-size="11.5" fill="#92400e" text-anchor="middle">此时 MR 尚未合并</text>

  <rect x="418" y="1252" width="284" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="560" y="1284" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">⑪ reconcile：停 Agent</text>
  <text x="560" y="1308" font-size="11.5" fill="#1e40af" text-anchor="middle">非激活且非终止 → 保留工作区</text>
  <text x="560" y="1328" font-size="11.5" fill="#1e40af" text-anchor="middle">记入 history → 仪表盘可查</text>

  <polygon points="1340,1384 1512,1440 1340,1496 1168,1440" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="1340" y="1436" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">⑫ 人工评审 MR</text>
  <text x="1340" y="1458" font-size="11.5" fill="#0f766e" text-anchor="middle">合并 / 打回</text>

  <rect x="78" y="1528" width="132" height="92" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="144" y="1564" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">改回激活</text>
  <text x="144" y="1588" font-size="11.5" fill="#9a3412" text-anchor="middle">active</text>

  <rect x="220" y="1528" width="132" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="286" y="1564" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">已关闭</text>
  <text x="286" y="1588" font-size="11.5" fill="#991b1b" text-anchor="middle">closed</text>

  <rect x="418" y="1528" width="284" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="560" y="1562" font-size="14.5" font-weight="700" fill="#991b1b" text-anchor="middle">⑬ 终止态：收尾</text>
  <text x="560" y="1586" font-size="11.5" fill="#991b1b" text-anchor="middle">停 Agent + 删除工作区</text>
  <text x="560" y="1604" font-size="11.5" fill="#991b1b" text-anchor="middle">未推送的改动会一并丢失</text>

  <rect x="768" y="1470" width="334" height="152" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="935" y="1498" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">可观测 / 可追溯</text>
  <text x="790" y="1524" font-size="11" fill="#475569">仪表盘 :4567 · Recent sessions</text>
  <text x="790" y="1546" font-size="11" fill="#475569">GET /api/v1/state · /api/v1/&lt;ID&gt;</text>
  <text x="790" y="1568" font-size="11" fill="#475569">会话 JSONL  ~/.claude/projects/…</text>
  <text x="790" y="1590" font-size="11" fill="#475569">服务日志  log/symphony.log.1</text>
  <text x="790" y="1612" font-size="11" fill="#475569">工作区  ~/code/symphony-workspaces/&lt;ID&gt;</text>

  <g fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round">
    <path d="M 352 240 L 414 240" marker-end="url(#ar)"/>
    <path d="M 560 284 L 560 314" marker-end="url(#ar)"/>
    <path d="M 560 418 L 560 448" marker-end="url(#ar)"/>
    <path d="M 702 502 L 735 502 L 735 642 L 764 642" marker-end="url(#ar)"/>
    <path d="M 935 698 L 935 728" marker-end="url(#ar)"/>
    <path d="M 935 806 L 935 836" marker-end="url(#ar)"/>
    <path d="M 935 932 L 935 962" marker-end="url(#ar)"/>
    <path d="M 1102 1027 L 1164 1027" marker-end="url(#ar)"/>
    <path d="M 1168 1060 L 1135 1060 L 1135 1170 L 1106 1170" marker-end="url(#ar)"/>
    <path d="M 768 1170 L 356 1170" marker-end="url(#ar)"/>
    <path d="M 215 1218 L 215 1240 L 560 1240 L 560 1248" marker-end="url(#ar)"/>
    <path d="M 560 1352 L 560 1370 L 1340 1370 L 1340 1380" marker-end="url(#ar)"/>
  </g>

  <path d="M 1340 1496 L 1340 1700 L 286 1700 L 286 1624" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar-green)"/>
  <text x="700" y="1692" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">合并 + 验证通过</text>

  <path d="M 1168 1440 L 144 1440 L 144 1524" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar-orange)"/>
  <text x="700" y="1432" font-size="12" font-weight="600" fill="#c2410c" text-anchor="middle">打回 · 要求修改（改回激活）</text>

  <path d="M 352 1574 L 414 1574" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <path d="M 170 1620 L 170 1660 L 36 1660 L 36 240 L 74 240" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ar-orange)"/>
  <text x="20" y="900" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle" transform="rotate(-90 20 900)">打回后：复用原工作区 · 切回原分支 · 增量修改 · 更新原 MR</text>

  <text x="1132" y="1016" font-size="10.5" fill="#475569" text-anchor="middle">推送</text>
  <text x="1128" y="1112" font-size="10.5" fill="#475569" text-anchor="end">MR 链接</text>
  <text x="500" y="1162" font-size="10.5" fill="#475569" text-anchor="middle">回写</text>
  <text x="880" y="1362" font-size="10.5" fill="#475569" text-anchor="middle">等待人工，Agent 已停</text>

  <text x="60" y="1766" font-size="12" fill="#475569">状态语义：「已解决」= 代码已交付、待评审验收（In Review，工作区保留）；「已关闭」= 验证通过，工作区销毁。二者之间必须经过人工合并 MR。</text>
</svg>
